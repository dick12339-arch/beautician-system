        header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
        .eyebrow { font-size: 11px; letter-spacing: 2.5px; color: #C9A03E; margin-bottom: 6px; text-transform: uppercase; }
        h1 { font-family: Georgia, 'Noto Serif TC', serif; font-size: 26px; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
        .sub { font-size: 12px; color: #8A8175; margin-top: 4px; }
        .toolbar-v7 { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; justify-content: space-between; }
        .toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toolbar-center { display: flex; align-items: center; gap: 8px; }
        .toolbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
        @media (max-width: 600px) { .toolbar-v7 { flex-direction: column; align-items: stretch; } .toolbar-left, .toolbar-center, .toolbar-right { width: 100%; } .toolbar-right { margin-left: 0; justify-content: flex-end; } }
        .toolbar-v7.v11-clean { justify-content: flex-end; margin-bottom: 12px; }
        .sync-status, .cloud-status-line, .cloud-status-clickable { display: none !important; }
        .btn { padding: 11px 16px; border-radius: 10px; font-size: 14px; cursor: pointer; border: none; outline: none; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-weight: 600; transition: transform 0.15s ease, filter 0.15s ease; white-space: nowrap; }
        .btn:active { transform: scale(0.98); filter: brightness(0.95); }
        .btn-sm { padding: 8px 12px; min-height: 36px; font-size: 12px; border-radius: 8px; }
        .shine { position: relative; overflow: hidden; background-size: 220% 220% !important; animation: chromeShift 7s ease-in-out infinite; }
        .shine::after { content: ""; position: absolute; top: -30%; left: -60%; width: 35%; height: 160%; background: linear-gradient(120deg, transparent, rgba(255,255,255,0.85), transparent); transform: skewX(-20deg); animation: shineSweep 3.2s ease-in-out infinite; pointer-events: none; }
        @keyframes chromeShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes shineSweep { 0% { left: -60%; } 45% { left: 130%; } 100% { left: 130%; } }
        .chrome-silver { background: linear-gradient(160deg, #fafafa 0%, #d4d4d4 25%, #f4f4f4 45%, #aaaaaa 65%, #eaeaea 85%, #c7c7c7 100%); color: #2a2a2a; border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 3px rgba(0,0,0,0.25), 0 3px 8px rgba(0,0,0,0.35); }
        .chrome-gold { background: linear-gradient(160deg, #fff6d8 0%, #e7c465 25%, #fff0b8 45%, #a8781f 65%, #f6e0a3 85%, #cda247 100%); color: #3a2e12; border: 1px solid rgba(255,244,200,0.6); box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 3px rgba(0,0,0,0.3), 0 3px 8px rgba(0,0,0,0.35); }
        .chrome-rose { background: linear-gradient(160deg, #ffe3ea 0%, #e8a0b5 25%, #ffd6e0 45%, #b45770 65%, #f8c3d1 85%, #d98aa0 100%); color: #3a1520; border: 1px solid rgba(255,230,236,0.6); box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 3px rgba(0,0,0,0.3), 0 3px 8px rgba(0,0,0,0.35); }
        .sync-status { font-size: 12px; color: #8A8175; display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #211B15; border: 1px solid #322A22; border-radius: 999px; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #6B6459; display: inline-block; flex-shrink: 0; }
        .sync-dot.ok { background: #8FBF8F; box-shadow: 0 0 8px rgba(143,191,143,0.6); }
        .sync-dot.busy { background: #E8C36A; animation: pulse 1s infinite; }
        .sync-dot.error { background: #E88A8A; box-shadow: 0 0 8px rgba(232,138,138,0.6); }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: fadeIn 0.22s ease; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }
        .panel { background: #262019; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #322A22; }
        .panel-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #F2EBDD; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .stat-card { background: #211B15; padding: 16px; border-radius: 10px; text-align: center; border: 1px solid #322A22; }
        .stat-card h3 { margin: 0 0 8px 0; font-size: 12px; color: #A69B8B; font-weight: 500; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 28px; font-weight: 800; color: #C9A03E; font-family: Georgia, serif; line-height: 1.1; }
        .stat-card .subval { font-size: 11px; color: #8A8175; margin-top: 6px; }
        .rank-list { display: flex; flex-direction: column; gap: 8px; }
        /* V16 平均格子：44px 1fr 84px */
        .rank-item { display: grid; grid-template-columns: 44px 1fr 84px; gap: 10px; align-items: center; background: #211B15; border: 1px solid #322A22; border-radius: 8px; padding: 10px 12px; min-height: 64px; }
        .rank-item .left { display: flex; align-items: center; gap: 10px; }
        .rank-left { display: flex; align-items: center; justify-content: center; width: 44px; }
        .rank-mid { width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .rank-mid .name { font-size: 14px; font-weight: 700; color: #F2EBDD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
        .rank-mid .loc { font-size: 11px; color: #8A8175; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; min-height: 14px; }
        .rank-mid .meta { font-size: 10px; color: #6B6459; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-right { width: 84px; display: flex; justify-content: center; align-items: center; }
        .rank-right .badge { padding: 6px 10px; font-size: 12px; min-width: 64px; justify-content: center; text-align: center; }
        .rank-header { display: grid; grid-template-columns: 44px 1fr 84px; gap: 10px; align-items: center; padding: 8px 12px; font-size: 11px; color: #8A8175; font-weight: 700; letter-spacing: 0.5px; background: #241E17; border: 1px solid #322A22; border-radius: 8px; margin-bottom: 8px; }
        .rank-header span:nth-child(1) { text-align: center; }
        .rank-header span:nth-child(3) { text-align: center; }
        .rank-num { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: #322A22; color: #C9A03E; flex-shrink:0; }
        .rank-num.gold { background: linear-gradient(160deg, #fff6d8, #cda247); color: #3a2e12; box-shadow: 0 0 8px rgba(205,162,71,0.5); }
        .rank-num.silver { background: linear-gradient(160deg, #fafafa, #a0a0a0); color: #2a2a2a; box-shadow: 0 0 6px rgba(180,180,180,0.4); }
        .rank-num.bronze { background: linear-gradient(160deg, #f5d0a0, #8a5a2b); color: #3a2410; box-shadow: 0 0 6px rgba(138,90,43,0.4); }
        .clickable-name { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: rgba(201,160,62,0.4); transition: color 0.15s ease; }
        .clickable-name:hover { color: #C9A03E; }
        .textarea-wrap { position: relative; }
        textarea.batch-input { width: 100%; min-height: 220px; max-height: 60vh; padding: 14px 14px; border-radius: 10px; border: 1px solid #45413A; background: #1C1815; color: #F2EBDD; font-size: 13px; line-height: 1.6; outline: none; resize: vertical; font-family: ui-monospace, Menlo, monospace; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
        textarea.batch-input:focus { border-color: #C9A03E; box-shadow: 0 0 0 3px rgba(201,160,62,0.15); }
        .hint { font-size: 11px; color: #8A8175; margin-top: 8px; line-height: 1.5; }
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .action-row .btn { flex: 1; min-width: 140px; }

        .table-wrap.v15-daily { overflow-x: hidden; }
        .table-wrap.monthly-grid { overflow-x: hidden; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 100%; }
        th { font-size: 12px; font-weight: 600; text-align: left; padding: 10px 8px; background: #241E17; border-bottom: 1px solid #322A22; color: #A69B8B; white-space: nowrap; letter-spacing: 0.3px; }
        td { padding: 10px 8px; font-size: 13px; border-bottom: 1px solid #2A241D; background: #1C1815; vertical-align: middle; }
        td.wrap { white-space: normal; word-break: break-word; min-width: 80px; max-width: 360px; line-height: 1.5; }

        table.daily-table { table-layout: fixed; width: 100%; min-width: 100%; }
        table.daily-table th, table.daily-table td { padding: 10px 8px; font-size: 12px; line-height: 1.4; vertical-align: middle; overflow: hidden; }
        table.daily-table th:nth-child(1), table.daily-table td:nth-child(1) { width: 22%; white-space: normal; word-break: break-word; font-weight: 700; }
        table.daily-table th:nth-child(2), table.daily-table td:nth-child(2) { width: 30%; white-space: normal; word-break: break-word; font-size: 12px; line-height: 1.4; color: #A69B8B; }
